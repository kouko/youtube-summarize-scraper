# YTSS (YouTube Summarize Scraper) Configuration

# Output directory
output_dir: "./ytss-output"

# Timezone for upload date conversion (IANA name, e.g., "Asia/Taipei", "Asia/Tokyo")
# If unset: auto-detect from system → fallback to UTC
timezone: ""

# Subtitle language preferences (optional, supports regex via yt-dlp)
# If unset: detect video original language → fallback to English
# Note: YouTube requires zh-Hant/zh-Hans, not bare "zh"
preferred_languages:
  - ja
  - "zh-Hant,zh-Hans"
  - en

# Default video count per channel tab (e.g., 5 = up to 5 videos + 5 streams + 5 shorts)
default_count: 5

# Whisper settings
whisper:
  model_dir: "~/.ytss/models"
  default_model: "base"

  # Language-specific model overrides (ISO 639-1 keys)
  language_models:
    ja: "kotoba-ja"                  # Japanese-specialized (kotoba-tech, 1.4GB)
    zh: "belle-zh"                   # Chinese-specialized (BELLE-2, 1.5GB)
    en: "medium"

  # Model download URLs (optional, defaults to HuggingFace)
  model_sources:
    tiny: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
    base: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
    small: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
    medium: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.bin"
    large-v3: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin"
    large-v3-turbo: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"
    belle-zh: "https://huggingface.co/BELLE-2/Belle-whisper-large-v3-turbo-zh-ggml/resolve/main/ggml-model.bin"
    kotoba-ja: "https://huggingface.co/kotoba-tech/kotoba-whisper-v2.0-ggml/resolve/main/ggml-model.bin"
    kotoba-ja-q5: "https://huggingface.co/kotoba-tech/kotoba-whisper-v2.0-ggml/resolve/main/ggml-model-q5.bin"

  # Timeout settings (minutes)
  transcribe_timeout: 30               # Whisper transcription timeout (default: 30)
  download_timeout: 10                 # Audio download timeout (default: 10)

# Cookie settings (optional)
cookie:
  file: ""                           # Path to cookie.txt (Netscape format)
  browser: ""                        # chrome / firefox / safari / edge / brave
  chrome_profile: ""                 # Chrome profile name (e.g., "Default", "Profile 1")

# LLM settings
llm:
  provider: "ollama"                 # ollama / llamacpp / claude-api / claude-code / gemini-cli / qwen-code / openai-compat
                                     # Use a list for fallback chain (first = primary, rest = fallbacks):
                                     #   provider:
                                     #     - "gemini-cli"
                                     #     - "claude-code"
                                     #     - "ollama"
  # provider_fallback_strategy:      # Controls how the fallback chain behaves (only needed with multiple providers)
  #   cooldown_seconds: 300          # Seconds before retrying a failed provider (default: 300 = 5 min)
  #   failure_threshold: 1           # Quota errors before skipping a provider (default: 1)
  ollama:
    model: "llama3"
    endpoint: "http://localhost:11434"
    think: false                       # Set true to enable thinking mode (better quality, slower, uses 4x tokens)
    timeout: 900                       # Seconds per LLM request (default: 900 = 15 min)
  llamacpp:
    endpoint: "http://localhost:8080"
  claude-api:
    api_key: "${CLAUDE_API_KEY}"
    model: "claude-sonnet-4-20250514"
  claude-code:                           # Claude Code CLI (non-interactive mode)
    model: "haiku"                       # Model alias (haiku/sonnet/opus) or full name, reference to https://code.claude.com/docs/en/model-config for details
    path: ""                             # Path to claude binary (default: search in PATH)
    timeout: 900                         # Seconds per LLM request (default: 900 = 15 min)
  gemini-cli:
    model: "auto"                      # Model alias(auto/pro/flash/flash-lite), reference to https://geminicli.com/docs/cli/cli-reference/#model-aliases for details
    path: ""                           # Path to gemini binary (default: search in PATH)
    timeout: 900                       # Seconds per LLM request (default: 900 = 15 min)
  qwen-code:                           # Qwen Code CLI (gemini-cli fork, free 1000 req/day)
    model: "coder-model"               # "coder-model" (free tier, server-routed) or "qwen3-coder-plus" / "qwen3.5-plus" (paid)
    path: ""                           # Path to qwen binary (default: search in PATH)
    timeout: 900                       # Seconds per LLM request (default: 900 = 15 min)
  openai-compat:                       # Any OpenAI-compatible server (oMLX, LM Studio, vLLM, etc.)
    endpoint: "http://localhost:8000/v1"
    model: "mlx-community/Qwen3-32B-4bit"
    api_key: ""                        # Optional API key
    timeout: 900                       # Seconds per LLM request (default: 900 = 15 min)

# Summary settings
summary:
  language: "zh-Hant"                # Selects built-in prompt language (en / zh-Hant / ja)
  prompt: ""                         # Inline prompt (overrides built-in)
  summary_prompt_file: ""            # External prompt file (overrides inline and built-in)
  max_tokens: 2000
  keywords:
    enabled: true
    language: "zh-Hant"              # Keyword language
    count: 10
  mermaid:
    enabled: true

# Video filter settings
filter:
  types: ["video", "live", "short"]  # video / live / short (default: all types)
  min_duration: 0                    # Min seconds (0 = no filter)
  max_duration: 0                    # Max seconds (0 = no limit)
  exclude_availability:              # Exclude videos by availability (default: ["members_only", "private"])
    - members_only                   # YouTube channel membership content
    - private                        # Private videos
    # - subscriber_only              # Channel subscriber-only content
    # - premium_only                 # YouTube Premium exclusive
    # - needs_auth                   # Requires authentication

# Batch processing settings
batch:
  random_order: true               # Shuffle channel processing order (default: true)
  delay_min: 0                     # Min seconds delay between channels (default: 0)
  delay_max: 0                     # Max seconds delay between channels (default: 0)
  watch: false                     # Enable watch mode (default: false, use --watch flag)
  watch_interval: 10               # Minutes between watch iterations (default: 10)
  fetch_concurrency: 3             # Max parallel yt-dlp list fetches (default: 3)

# Obsidian integration (optional)
obsidian:
  enabled: false
  auto_tags: ["youtube"]
  generate_moc: true
  wikilinks: true

# Playlist list
playlists:
  - url: "https://www.youtube.com/playlist?list=WL"
    name: "稍後觀看"              # Display name (optional, auto-detected)
    count: 10
    # cookie:                      # Per-playlist cookie (optional)
    #   browser: "chrome"
    #   chrome_profile: "Profile 1"

# Channel list
channels:
  - url: "https://www.youtube.com/@channel-a"
    count: 10                        # Per tab (override default_count)
    # summary_prompt_file: "./prompts/tech-summary.md"  # Per-channel prompt
    # filter:
    #   types: ["video"]
    #   min_duration: 60
    # copy_to:                       # Copy files after processing
    #   path: "/path/to/vault/YouTube/{channel_name}/{upload_date}__{title}"
    #   files: ["summary", "transcription"]
    #   filename: "{upload_date}_{title}_{type}.md"
    #   overwrite: false
  - url: "https://www.youtube.com/@channel-b"
  - url: "https://www.youtube.com/@channel-c"
